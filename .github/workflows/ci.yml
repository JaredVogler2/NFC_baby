name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never send real SMS from CI: the provider is forced off/mock and no Twilio secrets exist here.
  SMS_PROVIDER: 'off'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency advisories (report only)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Smoke E2E (no database)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/smoke.spec.ts
